<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Quadro de Tarefas Acadêmicas</title>
</head>

<body>
    <header>
        <h1>Quadro de Tarefas Acadêmicas</h1>
        <p>Gerenciador de tarefas de projetos acadêmicos.</p>
    </header>

    <main class="page-shell">
        <section class="filters" aria-labelledby="titulo-busca-filtros">
            <h2 id="titulo-busca-filtros">Busca e filtros</h2>

            <form class="filter-form">
                <div class="filter-search">
                    <label for="busca">Buscar tarefa por título:</label>
                    <input type="search" id="busca" name="busca">
                    <button type="submit">Buscar</button>
                </div>

                <fieldset>
                    <legend>Filtrar por status</legend>

                    <div>
                        <input type="radio" id="status-todos" name="status" value="todos">
                        <label for="status-todos">Todos</label>
                    </div>
                    <div>
                        <input type="radio" id="status-fazer" name="status" value="a-fazer">
                        <label for="status-fazer">A fazer</label>
                    </div>
                    <div>
                        <input type="radio" id="status-andamento" name="status" value="em-andamento">
                        <label for="status-andamento">Em andamento</label>
                    </div>
                    <div>
                        <input type="radio" id="status-revisao" name="status" value="em-revisao">
                        <label for="status-revisao">Em revisão</label>
                    </div>
                    <div>
                        <input type="radio" id="status-concluida" name="status" value="concluida">
                        <label for="status-concluida">Concluída</label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Filtrar por prioridade</legend>

                    <div>
                        <input type="radio" id="prioridade-todas" name="prioridade" value="todas">
                        <label for="prioridade-todas">Todas</label>
                    </div>
                    <div>
                        <input type="radio" id="prioridade-baixa" name="prioridade" value="baixa">
                        <label for="prioridade-baixa">Baixa</label>
                    </div>
                    <div>
                        <input type="radio" id="prioridade-media" name="prioridade" value="media">
                        <label for="prioridade-media">Média</label>
                    </div>
                    <div>
                        <input type="radio" id="prioridade-alta" name="prioridade" value="alta">
                        <label for="prioridade-alta">Alta</label>
                    </div>
                </fieldset>

                <button type="reset">Limpar filtros</button>
            </form>
        </section>

        <section class="board" aria-labelledby="titulo-quadro">
            <h2 id="titulo-quadro">Quadro de tarefas</h2>

            <div id="status-regiao" role="status" aria-live="polite"></div>
            <p id="mensagem-estado" class="sr-only"></p>

            <div class="board-grid"></div>
        </section>
    </main>

    <footer>
        <p>Arthur Rodrigues Mota</p>
    </footer>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
